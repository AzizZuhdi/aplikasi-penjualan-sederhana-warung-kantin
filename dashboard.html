<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Aplikasi Kantin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <nav class="navbar navbar-expand navbar-dark topbar">

        <a href="dashboard.html" class="brand">
            <i class="fa-solid fa-store"></i>
            Aplikasi Penjualan Sederhana Warung/Kantin
        </a>

        <!-- PENCARIAN -->
        <form class="search-form" id="searchForm">
            <input type="search" class="form-control" id="searchInput"
                placeholder="Cari transaksi, produk, atau lainnya" aria-label="Cari produk">

            <button type="submit" class="btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <!-- ADMIN -->
        <ul class="navbar-nav admin-dropdown">
            <li class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-circle-user me-1"></i>
                    <span id="adminName">Admin</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="#profil">Profil Saya</a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#pengaturan">Pengaturan</a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <a class="dropdown-item" href="login.html">Logout</a>
                    </li>
                </ul>
            </li>
        </ul>

    </nav>

    <!-- SIDEBAR DAN KONTEN -->
    <div class="page-layout">

        <!-- SIDEBAR KIRI -->
        <aside class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="kategori.html">
                    <i class="fa-solid fa-tags"></i>
                    <span>Kategori</span>
                </a>
                <a class="nav-link" href="produk.html">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Produk</span>
                </a>
                <a class="nav-link" href="kasir.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Kasir/Penjualan</span>
                </a>
                <a class="nav-link" href="riwayat.html">
                    <i class="fa-regular fa-clock"></i>
                    <span>Riwayat</span>
                </a>
                <a class="nav-link" href="laporan.html">
                    <i class="fa-solid fa-book"></i>
                    <span>Laporan</span>
                </a>
                <a class="nav-link" href="login.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- KONTEN KANAN -->
        <main class="main-content">

            <!-- JUDUL DASHBOARD -->
            <section id="ringkasan">
                <h1 class="page-title">Dashboard</h1>
                <p class="breadcrumb-text">Menu &gt; Dashboard</p>
            </section>

            <!-- KARTU RINGKASAN -->
            <section class="summary-row">

                <div class="summary-card sales-card">
                    <div>
                        <p class="summary-label">Omzet hari ini</p>
                        <h2 class="summary-value" id="totalOmzet">Rp.</h2>
                    </div>

                    <i class="fa-solid fa-box summary-icon"></i>
                </div>

                <div class="summary-card transaction-card">
                    <div>
                        <p class="summary-label">Jumlah Transaksi</p>
                        <h2 class="summary-value" id="totalTransaksi">
                            0 Transaksi
                        </h2>
                    </div>

                    <i class="fa-solid fa-cart-shopping summary-icon"></i>
                </div>

            </section>

            <!-- TABEL STOK RENDAH -->
            <!-- TABEL STOK RENDAH -->
            <section class="product-card" id="produk">
                <div class="product-header">
                    <i class="fa-solid fa-triangle-exclamation"></i> Stok rendah
                </div>

                <hr class="white-line">

                <div class="product-body">
                    <div class="table-responsive px-2">
                        <table class="table table-bordered custom-table align-middle">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Kode produk</th>
                                    <th>Nama produk</th>
                                    <th>Sisa stok</th>
                                </tr>
                            </thead>
                            <tbody id="productTable">
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td>&nbsp;</td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- JAVASCRIPT BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript.js"></script>
</body>

</html>
