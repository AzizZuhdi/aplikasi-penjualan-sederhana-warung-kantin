
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produk - Aplikasi Kantin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #e5faf2;
        font-family: Arial, sans-serif;
        color: #172b28;
    }

    .content {
        padding: 22px 16px;
    }

    .page-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 2px;
    }

    .breadcrumb-text {
        color: #647b77;
        margin-bottom: 18px;
    }

    /* Kotak utama */
    .product-container {
        border: 2px solid #455e58;
        border-radius: 42px;
        padding: 20px;
        min-height: 460px;
        background: #e5faf2;
    }

    .product-heading {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
    }

    .search-box {
        width: 205px;
        border: 2px solid #536b65;
        border-radius: 6px;
        background: transparent;
        padding: 7px 10px;
    }

    .category-select {
        width: 130px;
        border: 2px solid #536b65;
        border-radius: 6px;
        padding: 7px;
        background: transparent;
    }

    .btn-add {
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 7px 17px;
    }

    .btn-add:hover {
        background: #0b5ed7;
        color: white;
    }

    /* Tabel */
    .table-wrapper {
        overflow-x: auto;
    }

    .product-table {
        width: 100%;
        min-width: 450px;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid #cbdedb;
        border-radius: 7px;
        overflow: hidden;
        background: #f8fffd;
    }

    .product-table th {
        background: #d8e9ff;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        padding: 11px 7px;
        border: 1px solid #cbd8e4;
        white-space: nowrap;
    }

    .product-table td {
        padding: 10px 7px;
        border: 1px solid #d6e5e1;
        text-align: center;
        font-size: 13px;
    }

    .product-table tbody tr:hover {
        background: #e9f3ff;
    }

    .action-btn {
        border: none;
        border-radius: 5px;
        padding: 5px 8px;
        margin: 0 2px;
    }

    .edit-btn {
        background: #d9eaff;
        color: #0875d1;
    }

    .delete-btn {
        background: #ffe0e3;
        color: #dc3545;
    }

    /* Panel tambah produk */
    .form-panel {
        border: 2px solid #455e58;
        border-radius: 35px;
        overflow: hidden;
        background: #e5faf2;
    }

    .form-panel-header {
        padding: 12px 18px;
        border-bottom: 2px solid #455e58;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        font-size: 18px;
    }

    .form-panel-body {
        padding: 16px 18px 18px;
    }

    .form-panel .form-label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-panel .form-control,
    .form-panel .form-select {
        border: 1.5px solid #61766f;
        border-radius: 6px;
        background: #f4fffb;
        font-size: 13px;
        padding: 8px 10px;
    }

    .form-panel .form-control:focus,
    .form-panel .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px #0d6efd25;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
    }

    .btn-cancel {
        background: #e2e6ea;
        border: 1px solid #697a75;
        padding: 7px 20px;
        border-radius: 6px;
    }

    .btn-save {
        background: #0d6efd;
        color: white;
        border: 1px solid #0d6efd;
        padding: 7px 22px;
        border-radius: 6px;
    }

    .btn-save:hover {
        background: #0b5ed7;
        color: white;
    }

    .close-panel {
        border: none;
        background: transparent;
        font-size: 24px;
        line-height: 1;
    }

    /* Modal untuk layar kecil */
    .modal-content {
        border: 2px solid #0d6efd;
        border-radius: 22px;
        overflow: hidden;
    }

    .modal-header {
        background: #0d6efd;
        color: white;
    }

    .modal-header .btn-close {
        filter: brightness(0) invert(1);
    }

    .modal-body {
        background: #e5faf2;
    }

    /* Responsif */
    @media (max-width: 767px) {
        .content {
            padding: 15px 10px;
        }

        .product-container {
            border-radius: 25px;
            padding: 13px;
        }

        .form-panel {
            margin-top: 20px;
            border-radius: 22px;
        }

        .search-box {
            width: 100%;
        }

        .toolbar {
            align-items: stretch;
        }
    }
</style>
</head>

<body>

<div class="content">

    <h1 class="page-title">Produk</h1>
    <p class="breadcrumb-text">Menu &gt; Produk</p>

    <div class="product-container">
        <div class="row g-4">

            <!-- DAFTAR PRODUK -->
            <div class="col-lg-7">
                <div class="product-heading">Daftar Produk</div>

                <div class="toolbar">
                    <input
                        type="search"
                        id="searchProduct"
                        class="search-box"
                        placeholder="🔍 Cari nama produk..."
                        oninput="renderProducts()"
                    >

                    <label for="filterCategory">Kategori</label>

                    <select
                        id="filterCategory"
                        class="category-select"
                        onchange="renderProducts()"
                    >
                        <option value="">Semua</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                    </select>

                    <button class="btn-add ms-lg-auto"
                        onclick="openAddForm()">
                        <i class="fa-solid fa-plus"></i> Tambah
                    </button>
                </div>

                <div class="table-wrapper">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>

                        <tbody id="productList">
                            <tr>
                                <td colspan="6">Belum ada produk.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- FORM PRODUK DI SEBELAH KANAN -->
            <div class="col-lg-5" id="formColumn" hidden>
                <div class="form-panel">

                    <div class="form-panel-header">
                        <span id="formTitle">Tambah Produk</span>

                        <button type="button"
                            class="close-panel"
                            onclick="closeForm()"
                            aria-label="Tutup">
                            &times;
                        </button>
                    </div>

                    <div class="form-panel-body">
                        <form id="productForm">

                            <div class="form-group">
                                <label class="form-label"
                                    for="productName">Nama Produk</label>

                                <input class="form-control"
                                    id="productName"
                                    type="text"
                                    placeholder="Masukkan nama produk..."
                                    required>
                            </div>

                            <div class="form-group">
                                <label class="form-label"
                                    for="productCategory">Kategori</label>

                                <select class="form-select"
                                    id="productCategory" required>
                                    <option value="">Pilih Kategori</option>
                                    <option value="Makanan">Makanan</option>
                                    <option value="Minuman">Minuman</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label"
                                    for="productCode">Kode produk</label>

                                <input class="form-control"
                                    id="productCode"
                                    type="text"
                                    placeholder="Masukkan kode produk..."
                                    required>
                            </div>

                            <div class="form-group">
                                <label class="form-label"
                                    for="productPrice">Harga (Rp)</label>

                                <input class="form-control"
                                    id="productPrice"
                                    type="number"
                                    min="0"
                                    placeholder="Masukkan harga..."
                                    required>
                            </div>

                            <div class="form-group">
                                <label class="form-label"
                                    for="productStock">Stok</label>

                                <input class="form-control"
                                    id="productStock"
                                    type="number"
                                    min="0"
                                    placeholder="Masukkan jumlah stok..."
                                    required>
                            </div>

                            <div class="form-actions">
                                <button type="button"
                                    class="btn-cancel"
                                    onclick="closeForm()">
                                    Batal
                                </button>

                                <button type="submit" class="btn-save">
                                    Simpan
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL TAMBAH PRODUK UNTUK LAYAR KECIL -->
<div class="modal fade" id="productModal" tabindex="-1"
    aria-labelledby="modalTitle" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">
                    Tambah Produk
                </h5>

                <button type="button" class="btn-close"
                    data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>

            <div class="modal-body">
                <p class="mb-0">
                    Pada layar kecil, gunakan tombol Tambah untuk membuka
                    formulir produk.
                </p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let products = [];
    let editingIndex = -1;

    const formColumn = document.getElementById("formColumn");
    const productForm = document.getElementById("productForm");

    function openAddForm() {
        editingIndex = -1;
        productForm.reset();

        document.getElementById("formTitle").textContent = "Tambah Produk";
        formColumn.hidden = false;

        if (window.innerWidth < 992) {
            formColumn.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        document.getElementById("productName").focus();
    }

    function closeForm() {
        formColumn.hidden = true;
        productForm.reset();
        editingIndex = -1;
    }

    function renderProducts() {
        const keyword = document.getElementById("searchProduct")
            .value.toLowerCase().trim();

        const category = document.getElementById("filterCategory").value;
        const list = document.getElementById("productList");

        const filtered = products
            .map((product, index) => ({ ...product, originalIndex: index }))
            .filter(product =>
                product.name.toLowerCase().includes(keyword) &&
                (!category || product.category === category)
            );

        if (filtered.length === 0) {
            list.innerHTML = `
                <tr>
                    <td colspan="6">Tidak ada produk ditemukan.</td>
                </tr>`;
            return;
        }

        list.innerHTML = filtered.map((product, index) => `
            <tr>
                <td>${index + 1}</td>
                <td>${escapeHTML(product.name)}</td>
                <td>${escapeHTML(product.category)}</td>
                <td>Rp ${Number(product.price).toLocaleString("id-ID")}</td>
                <td>${product.stock}</td>
                <td>
                    <button class="action-btn edit-btn"
                        onclick="editProduct(${product.originalIndex})"
                        title="Edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <button class="action-btn delete-btn"
                        onclick="deleteProduct(${product.originalIndex})"
                        title="Hapus">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join("");
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    productForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("productName").value.trim();
        const category = document.getElementById("productCategory").value;
        const code = document.getElementById("productCode").value.trim();
        const price = Number(document.getElementById("productPrice").value);
        const stock = Number(document.getElementById("productStock").value);

        if (!name || !category || !code ||
            price < 0 || stock < 0) {
            alert("Silakan isi data produk dengan benar.");
            return;
        }

        const duplicate = products.some((product, index) =>
            product.code.toLowerCase() === code.toLowerCase() &&
            index !== editingIndex
        );

        if (duplicate) {
            alert("Kode produk sudah digunakan.");
            return;
        }

        const product = { name, category, code, price, stock };

        if (editingIndex === -1) {
            products.push(product);
        } else {
            products[editingIndex] = product;
        }

        renderProducts();
        closeForm();
    });

    function editProduct(index) {
        const product = products[index];

        editingIndex = index;

        document.getElementById("productName").value = product.name;
        document.getElementById("productCategory").value = product.category;
        document.getElementById("productCode").value = product.code;
        document.getElementById("productPrice").value = product.price;
        document.getElementById("productStock").value = product.stock;

        document.getElementById("formTitle").textContent = "Edit Produk";
        formColumn.hidden = false;

        if (window.innerWidth < 992) {
            formColumn.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    }

    function deleteProduct(index) {
        if (confirm("Yakin ingin menghapus produk ini?")) {
            products.splice(index, 1);
            renderProducts();
        }
    }

    renderProducts();
</script>

</body>
</html>
