<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Aplikasi Kantin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER / NAVBAR (Disesuaikan dengan Dashboard) -->
    <nav class="navbar navbar-expand navbar-dark topbar">
        <a href="dashboard.html" class="brand">
            <i class="fa-solid fa-store"></i>
            Aplikasi Penjualan Sederhana Warung/Kantin
        </a>

        <!-- PENCARIAN -->
        <form class="search-form" id="globalSearch">
            <input type="search" class="form-control" id="globalSearchInput"
                placeholder="Cari transaksi, produk, atau lainnya" aria-label="Cari">
            <button type="submit" class="btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <!-- ADMIN -->
        <ul class="navbar-nav admin-dropdown">
            <li class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-circle-user me-1"></i>
                    <span id="adminName">Admin</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#profil">Profil Saya</a></li>
                    <li><a class="dropdown-item" href="#pengaturan">Pengaturan</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="login.html">Logout</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <!-- LAYOUT UTAMA -->
    <div class="page-layout">

        <!-- SIDEBAR KIRI -->
        <aside class="sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link active" href="produk.html">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Produk</span>
                </a>
                <a class="nav-link" href="kasir.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Kasir/Penjualan</span>
                </a>
                <a class="nav-link" href="riwayat.html">
                    <i class="fa-regular fa-clock"></i>
                    <span>Riwayat</span>
                </a>
                <a class="nav-link" href="laporan.html">
                    <i class="fa-solid fa-book"></i>
                    <span>Laporan</span>
                </a>
                <a class="nav-link" href="login.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <!-- KONTEN PRODUK (Kanan) -->
        <main class="main-content">
            <h1 class="page-title">Produk</h1>
            <p class="breadcrumb-text">Menu &gt; Produk</p>

            <section class="product-panel">
                <div class="panel-heading">Daftar Produk</div>

                <div class="toolbar">
                    <input type="search" id="productSearch" class="form-control" placeholder="🔍 Cari nama produk...">
                    <select id="categoryFilter" class="form-select">
                        <option value="">Semua Kategori</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                    </select>

                    <button class="add-button" data-bs-toggle="modal" data-bs-target="#productModal"
                        onclick="prepareAdd()">
                        <i class="fa-solid fa-plus me-1"></i> Tambah
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered product-table align-middle">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- Data Tabel Dimasukkan Lewat JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

    </div>

    <!-- MODAL TAMBAH/EDIT PRODUK -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Tambah Produk</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <form id="productForm">
                    <div class="modal-body">
                        <input type="hidden" id="editIndex" value="-1">

                        <div class="mb-3">
                            <label for="productName" class="form-label">Nama Produk</label>
                            <input type="text" class="form-control" id="productName"
                                placeholder="Masukkan nama produk..." required>
                        </div>
                        <div class="mb-3">
                            <label for="productCategory" class="form-label">Kategori</label>
                            <select class="form-select" id="productCategory" required>
                                <option value="">Pilih Kategori</option>
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="productCode" class="form-label">Kode Produk</label>
                            <input type="text" class="form-control" id="productCode"
                                placeholder="Masukkan kode produk..." required>
                        </div>
                        <div class="mb-3">
                            <label for="productPrice" class="form-label">Harga (Rp)</label>
                            <input type="number" min="0" class="form-control" id="productPrice"
                                placeholder="Masukkan harga..." required>
                        </div>
                        <div class="mb-3">
                            <label for="productStock" class="form-label">Stok</label>
                            <input type="number" min="0" class="form-control" id="productStock"
                                placeholder="Masukkan jumlah stok..." required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // [KODE JAVASCRIPT ANDA TETAP SAMA, TIDAK ADA YANG DIUBAH]
        const productForm = document.getElementById("productForm");
        const tableBody = document.getElementById("productTableBody");
        const productModal = document.getElementById("productModal");
        let products = [];
        let modalInstance = bootstrap.Modal.getOrCreateInstance(productModal);
        document.getElementById("adminName").textContent = sessionStorage.getItem("myshopUsername") || "Admin";

        function prepareAdd() {
            productForm.reset();
            document.getElementById("editIndex").value = "-1";
            document.getElementById("modalTitle").textContent = "Tambah Produk";
        }

        function renderProducts() {
            const search = document.getElementById("productSearch").value.toLowerCase();
            const category = document.getElementById("categoryFilter").value;
            const filtered = products.filter(p => p.name.toLowerCase().includes(search) && (!category || p.category === category));
            tableBody.innerHTML = "";

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-secondary">Tidak ada produk yang ditemukan.</td></tr>`;
                return;
            }

            filtered.forEach(p => {
                const index = products.indexOf(p);
                const row = document.createElement("tr");
                [index + 1, p.name, p.category, "Rp " + Number(p.price).toLocaleString("id-ID"), p.stock].forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value;
                    row.appendChild(td);
                });
                const actions = document.createElement("td");
                const edit = document.createElement("button");
                edit.type = "button"; edit.className = "action-btn edit-btn"; edit.innerHTML = '<i class="fa-solid fa-pen"></i>'; edit.onclick = () => editProduct(index);
                const del = document.createElement("button");
                del.type = "button"; del.className = "action-btn delete-btn"; del.innerHTML = '<i class="fa-solid fa-trash"></i>'; del.onclick = () => deleteProduct(index);
                actions.append(edit, del);
                row.appendChild(actions);
                tableBody.appendChild(row);
            });
        }

        productForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const editIndex = Number(document.getElementById("editIndex").value);
            const code = document.getElementById("productCode").value.trim();
            const duplicate = products.some((p, i) => p.code.toLowerCase() === code.toLowerCase() && i !== editIndex);
            if (duplicate) { alert("Kode produk sudah digunakan!"); return; }
            const product = {
                name: document.getElementById("productName").value.trim(), category: document.getElementById("productCategory").value,
                code, price: Number(document.getElementById("productPrice").value), stock: Number(document.getElementById("productStock").value)
            };
            if (editIndex >= 0) { products[editIndex] = product; } else { products.push(product); }
            renderProducts(); modalInstance.hide(); productForm.reset();
        });

        function editProduct(index) {
            const p = products[index];
            document.getElementById("editIndex").value = index;
            document.getElementById("productName").value = p.name;
            document.getElementById("productCategory").value = p.category;
            document.getElementById("productCode").value = p.code;
            document.getElementById("productPrice").value = p.price;
            document.getElementById("productStock").value = p.stock;
            document.getElementById("modalTitle").textContent = "Edit Produk";
            modalInstance.show();
        }

        function deleteProduct(index) {
            if (confirm("Yakin ingin menghapus produk ini?")) { products.splice(index, 1); renderProducts(); }
        }

        document.getElementById("productSearch").addEventListener("input", renderProducts);
        document.getElementById("categoryFilter").addEventListener("change", renderProducts);
        document.getElementById("globalSearch").addEventListener("submit", function (e) {
            e.preventDefault();
            document.getElementById("productSearch").value = document.getElementById("globalSearchInput").value;
            renderProducts();
        });
        renderProducts();
    </script>
</body>

</html>
