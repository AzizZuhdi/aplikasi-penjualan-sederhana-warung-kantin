<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Aplikasi Kantin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER / NAVBAR (Disesuaikan dengan Dashboard) -->
    <nav class="navbar navbar-expand navbar-dark topbar">
        <a href="dashboard.html" class="brand">
            <i class="fa-solid fa-store"></i>
            Aplikasi Penjualan Sederhana Warung/Kantin
        </a>

        <!-- PENCARIAN -->
        <form class="search-form" id="globalSearch">
            <input type="search" class="form-control" id="globalSearchInput"
                placeholder="Cari transaksi, produk, atau lainnya" aria-label="Cari">
            <button type="submit" class="btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <!-- ADMIN -->
     <div class="admin-dropdown d-flex align-items-center gap-3">
            <div class="d-flex align-items-center text-white">
                <i class="fa-solid fa-circle-user fs-4 me-2"></i>
                <div class="text-start d-none d-sm-block">
                    <span class="d-block fw-bold" style="font-size: 14px; line-height: 1;">Kasir/Admin</span>
                    <span class="badge bg-info text-dark mt-1" style="font-size: 10px;">Status</span>
                </div>
            </div>

            <a href="login.html" class="btn btn-danger btn-sm fw-bold">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </a>
        </div>
    </nav>

    <!-- LAYOUT UTAMA -->
    <div class="page-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav class="nav flex-column" id="sidebarMenu">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                <a class="nav-link" href="kategori.html"><i class="fa-solid fa-tags"></i><span>Kategori</span></a>
                <a class="nav-link active" href="produk.html"><i class="fa-solid fa-layer-group"></i><span>Produk</span></a>
                <a class="nav-link" href="kasir.html"><i
                        class="fa-solid fa-bag-shopping"></i><span>Kasir/Penjualan</span></a>
                <a class="nav-link" href="riwayat.html"><i class="fa-regular fa-clock"></i><span>Riwayat</span></a>
                <a class="nav-link" href="laporan.html"><i class="fa-solid fa-book"></i><span>Laporan</span></a>

                <!-- MENU REKAP KHUSUS PEMILIK (Dipindah ke bawah Laporan) -->
                <a class="nav-link menu-pemilik d-none" href="rekap.html">
                    <i class="fa-solid fa-chart-pie"></i><span>Rekap Penjualan</span>
                </a>

                <a class="nav-link" href="login.html"><i
                        class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></a>
            </nav>
        </aside>

    <!-- KONTEN PRODUK -->
<main class="main-content">
    <h1 class="page-title">Produk</h1>
    <p class="breadcrumb-text">Menu &gt; Produk</p>

    <!-- FORM TAMBAH PRODUK -->
    <section class="product-panel mb-4" style="min-height: auto;">
        <div class="panel-heading mb-3">
            Tambah Produk Baru
        </div>

        <form id="productForm">
            <div class="row g-3">

                <div class="col-md-3">
                    <label for="productName" class="form-label fw-bold">
                        Nama Produk
                    </label>
                    <input type="text" class="form-control"
                        id="productName" placeholder="Cth: Nasi Goreng"
                        required>
                </div>

                <div class="col-md-3">
                    <label for="productCategory" class="form-label fw-bold">
                        Kategori
                    </label>
                    <select class="form-select" id="productCategory" required>
                        <option value="">Pilih...</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label for="productCode" class="form-label fw-bold">
                        Kode
                    </label>
                    <input type="text" class="form-control"
                        id="productCode" placeholder="Cth: MKN-01"
                        required>
                </div>

                <div class="col-md-2">
                    <label for="productPrice" class="form-label fw-bold">
                        Harga
                    </label>
                    <input type="number" class="form-control"
                        id="productPrice" placeholder="Rp"
                        min="0" required>
                </div>

                <div class="col-md-2">
                    <label for="productStock" class="form-label fw-bold">
                        Stok
                    </label>
                    <input type="number" class="form-control"
                        id="productStock" placeholder="Jumlah"
                        min="0" required>
                </div>

            </div>

            <div class="mt-3 text-end">
                <button type="reset" class="btn btn-secondary">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Simpan Data
                </button>
            </div>
        </form>
    </section>

    <!-- TABEL DAFTAR PRODUK -->
    <section class="product-panel">
        <div class="panel-heading">Daftar Produk</div>

        <div class="toolbar">
            <input type="search" id="productSearch"
                class="form-control"
                placeholder="🔍 Cari nama produk...">

            <select id="categoryFilter" class="form-select">
                <option value="">Semua Kategori</option>
                <option value="Makanan">Makanan</option>
                <option value="Minuman">Minuman</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered product-table align-middle">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Produk</th>
                        <th>Kategori</th>
                        <th>Kode</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>

                <!-- JavaScript akan mengisi tabel ini -->
                <tbody id="productTableBody">
                    <tr>
                        <td colspan="7" class="text-center">
                            Memuat data produk...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
    
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="produk.js"></script>
</body>

</html>
