<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Kantin</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* Desain Khusus Halaman Login */
        body {
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #ffffff;
        }
        .login-card h3 {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-store fa-3x text-primary mb-2"></i>
            <h3>Login Kantin</h3>
            <p class="text-muted">Silakan masuk menggunakan akun Anda</p>
        </div>
        
        <!-- Pesan Error jika password salah -->
        <div id="loginAlert" class="alert alert-danger d-none text-center" role="alert">
            Username atau Password salah!
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username / ID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan ID Anda" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                <i class="fa-solid fa-right-to-bracket me-1"></i> MASUK
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // SIMULASI DATABASE SERVER (Di Halaman Login)
        // ==========================================
        const serverUsers = [
            { username: "pemilik", password: "akuhebat2026", nama: "Pemilik", role: "Status" },
            { username: "kasir", password: "akuhebat2026", nama: "Kasir/Admin", role: "Status" }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');

            // Cek apakah username dan password cocok dengan data "Server"
            const user = serverUsers.find(u => u.username === userVal && u.password === passVal);

            if (user) {
                // Berhasil Login! Simpan "Session" ke LocalStorage
                localStorage.setItem('loggedInUser', JSON.stringify(user));
                
                // Pindah ke halaman Dashboard
                window.location.href = "dashboard.html";
            } else {
                // Gagal Login
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
